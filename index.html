    for (const [k, v] of Object.entries(S.days)) if (!cdays[k] || (v.ts || 0) > (cdays[k].ts || 0)) markDirty(monthId(k));
  } else {

      if (!id.startsWith('m-') || dirty.has(id) || inflight.has(id)) continue;

/* ---------- Mutations ---------- */
function setSettings(patch) { S.settings = { ...S.settings, ...patch, ts: Date.now() }; saveLocal(); markDirty('settings'); }
function ensureStart() { if (!S.settings.startDate) setSettings({ startDate: today() }); }
function getDay(date) { return S.days[date] || {}; }
function setDay(date, patch) {
  ensureStart();

}

/* ---------- Derived ---------- */
const startDate = () => S.settings.startDate || today();
const weekOf = date => Math.max(1, Math.floor(diff(startDate(), date) / 7) + 1);
const phaseOfWeek = w => (PHASES.find(p => w >= p.range[0] && w <= p.range[1]) || PHASES[4]).n;
const phaseFor = date => (date < today() && S.days[date] && S.days[date].phase) ? S.days[date].phase : S.settings.phase;
function typeFor(date) { const d = getDay(date); return d.type || SCHEDULE[parse(date).getDay()]; }
function sessionName(type, ph) { return (ph >= 4 && SESSION_NAMES_P4[type]) || SESSION_NAMES[type]; }
const groupOf = (id, cat) => id === 'dyn-warmup' ? 'Warm-up' : ({ Balance: 'Balance & core', Core: 'Balance & core', Plyometric: 'Impact & agility', Agility: 'Impact & agility', Running: 'Running', Cardio: 'Cardio', Strength: 'Strength', Mobility: 'Mobility' })[cat];
const runStage = () => Math.min(S.settings.runStage || 0, RUN.length - 1);
const dropMax = ph => ph >= 5 ? DROP.length - 1 : ph >= 4 ? 4 : ph >= 3 ? 2 : -1;
const dropStage = () => Math.max(0, Math.min(S.settings.dropStage || 0, dropMax(S.settings.phase)));
function doseOf(a) {
  if (a[0] === 'run-program') return RUN[runStage()].d;
  if (a[0] === 'depth-drop') { const r = DROP[dropStage()]; return `6 landings from ${r.l} (${r.d.charAt(0).toLowerCase() + r.d.slice(1)})`; }
  return a[2];
}
function lastLoad(id, before) {
  const ks = Object.keys(S.days).filter(k => k < before && S.days[k].load && S.days[k].load[id] != null).sort();
  return ks.length ? { date: ks[ks.length - 1], kg: S.days[ks[ks.length - 1]].load[id] } : null;
}
function blocksFor(date) {
  const P = PHASES[phaseFor(date) - 1], type = typeFor(date);
  const it = a => ({ id: a[0], sets: a[1], dose: doseOf(a) });
  if (type === 'strength') return [{ t: 'Warm-up', items: P.warmup.map(it) }, { t: 'Strength', items: P.strength.map(it) }, { t: 'Cool-down mobility', items: P.mobility.map(it) }];
  if (type === 'recovery') { const mob = P.mobility.some(a => a[0] === 'heel-slide') ? P.mobility : [['heel-slide', 2, '10 reps'], ...P.mobility]; return [{ t: 'Easy movement', items: [it(['cardio', 1, '20–30 min easy walk, optional'])] }, { t: 'Mobility', items: mob.map(it) }]; }
  const out = [];
  P.cond.forEach(a => { const g = groupOf(a[0], EX[a[0]].cat); const last = out[out.length - 1]; if (last && last.t === g) last.items.push(it(a)); else out.push({ t: g, items: [it(a)] }); });

  return out;
}
function dayPct(date) {
  const d = getDay(date); const done = d.done || {}; let tot = 0, got = 0;
  blocksFor(date).forEach(b => b.items.forEach(i => { tot += i.sets; got += Math.min(done[i.id] || 0, i.sets); }));
  return tot ? got / tot : 0;
}
function verdict(d) {
  const red = [], amber = [];
  [['L', 'Left'], ['R', 'Right']].forEach(([s, n]) => {
    const p = d['pain' + s] || 0;
    if (p >= 6) red.push(`${n} knee pain ${p}/10`); else if (p >= 3) amber.push(`${n} knee pain ${p}/10`);
    if (d['swell' + s] === 'visible') red.push(`${n} knee visibly swollen`); else if (d['swell' + s] === 'mild') amber.push(`${n} knee mildly swollen`);
    if (d['ext' + s] === 'no') red.push(`${n} knee won’t fully straighten`);
  });
  if (d.giveWay === 'yes') red.push('Knee gave way, locked or caught');
  if (d.stiff === 'gt30') amber.push('Morning stiffness over 30 min');
  if (d.morning === 'worse') amber.push('Worse than yesterday morning');
  const why = a => a.length ? ` (${a.join(', ')})` : '';
  if (red.length) {
    const ext = d.extL === 'no' || d.extR === 'no';
    return { c: 'red', t: 'Recovery day' + why(red), m: 'Skip impact and heavy strength today and do the recovery session only.' + (ext ? ' Losing full straightening can mean something is catching inside the joint; on the left that could be the notch lesion. Contact your orthopedist if it hasn’t returned by tomorrow.' : ' If this lasts more than 2 days, or the knee locks or gives way, contact your orthopedist.') };
  }

}
function stats() {
  const t = today();

  while (getDay(d).checkedIn) { streak++; d = addDays(d, -1); }
  const mon = mondayOf(t); let wk = 0;
  for (let i = 0; i < 7; i++) { const x = addDays(mon, i); if (x > t) break; if (typeFor(x) !== 'recovery' && dayPct(x) >= 0.5) wk++; }
  let sched = 0, hit = 0;
  for (let i = 0; i < 28; i++) { const x = addDays(t, -i); if (x < startDate()) break; if (typeFor(x) === 'recovery') continue; if (x === t && dayPct(x) < 0.5) continue; sched++; if (dayPct(x) >= 0.5) hit++; }

  for (let i = 0; i < 7; i++) { const x = getDay(addDays(t, -i)); if (x.checkedIn) { pl.push(x.painL || 0); pr.push(x.painR || 0); } }

  return { streak, wk, adh: sched ? Math.round(hit / sched * 100) : null, pl: avg(pl), pr: avg(pr) };
}

    </section>

    </section>
  </div>
  <section class="card"><div><div class="eyebrow">Off-road riding</div><h2>Back on the bike</h2></div>

      <div style="display:grid;gap:10px;min-width:0"><h3>How to stand on the pegs</h3>
        <ol class="rules">
          <li><span><b>Grip the tank with your knees and inner thighs.</b> This switches on the adductors and hamstrings and stops the knee twisting inward if the front wheel deflects off a rock.</span></li>
          <li><span><b>Hinge at the hips, not just the knees.</b> Keep your backside slightly back so the glutes absorb big hits, and never let the knees bottom out past 90°.</span></li>
          <li><span><b>Stay on the balls of your feet.</b> Ankles are your first suspension, just like in pogo hops.</span></li>
          <li><span><b>Keep both feet on the pegs.</b> Dabbing a foot down with a straight, planted leg while the bike moves is the classic twist that tears an ACL or meniscus. If you must dab, keep the knee bent and the foot moving.</span></li>
          <li><span><b>Sit down when your thighs burn.</b> Fatigue is when knees cave in. Stop and rest rather than ride on tired legs.</span></li>
        </ol>
      </div>
      <div style="display:grid;gap:10px;min-width:0"><h3>Return ladder (after clearance)</h3>
        <ol class="rules">
          <li><span>30–45 min easy road ride, mostly seated.</span></li>
          <li><span>1 h road ride with standing sections (moto-peg hold 3 × 90 s is easy by now).</span></li>
          <li><span>1 h smooth dirt or gravel, no jumps.</span></li>
          <li><span>2–3 h mixed trails, small obstacles.</span></li>
          <li><span>Technical trails and small jumps, once 2 ft drop landings feel automatic.</span></li>

  </section>`;
}

/* ---------- Library ---------- */
const exPhases = id => PHASES.filter(p => [...p.warmup, ...p.strength, ...p.cond, ...p.mobility].some(a => a[0] === id)).map(p => p.n);
const phaseRange = a => !a.length ? '' : a.length === 1 ? 'P' + a[0] : a.every((v, i) => !i || v === a[i - 1] + 1) ? `P${a[0]}–${a[a.length - 1]}` : a.map(n => 'P' + n).join(', ');
function libItems() {
  const q = ui.q.trim().toLowerCase();
  return Object.entries(EX).filter(([id, e]) => {
    if (ui.libPhase !== 'all' && !exPhases(id).includes(+ui.libPhase)) return false;
    if (ui.libCat !== 'all' && e.cat !== ui.libCat) return false;
    if (q && !(e.name + ' ' + e.target + ' ' + e.cat).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (exPhases(a[0])[0] || 9) - (exPhases(b[0])[0] || 9));
}
function libGrid() {
  const items = libItems();

  return items.map(([id, e]) => `<button class="lib-card" data-act="open-ex" data-ex="${id}"><div class="row"><span class="cat-ico">${IC[e.cat] || ''}</span><span class="chip">${phaseRange(exPhases(id)) || 'Alternative'}</span></div><h3>${esc(e.name)}</h3><span class="small muted">${esc(e.cat)} · ${esc(e.target)}</span><p>${esc(e.why)}</p></button>`).join('');
}
function viewLibrary() {

  <p class="muted" style="max-width:65ch">Each exercise explains why it matters for your knees, how to set up, the steps, what you should feel, common mistakes, and how to make it easier or harder.</p>
  <input type="search" id="libQ" placeholder="Search exercises, muscles…" value="${esc(ui.q)}" aria-label="Search exercises">
  <div class="chips">${[['all', 'All phases'], ...PHASES.map(p => [String(p.n), `P${p.n} ${p.name}`])].map(([v, l]) => `<button class="filter" data-act="lib-phase" data-v="${v}" aria-pressed="${ui.libPhase === v}">${l}</button>`).join('')}</div>
  <div class="chips">${[['all', 'All types'], ...cats.map(c => [c, c])].map(([v, l]) => `<button class="filter" data-act="lib-cat" data-v="${v}" aria-pressed="${ui.libCat === v}">${l}</button>`).join('')}</div>
  <div class="lib-grid" id="libGrid">${libGrid()}</div>`;
}

/* ---------- Progress ---------- */
function painChart() {
  const N = 30, t = today(), W = 640, H = 210, L = 30, R = 12, T = 10, B = 26;
  const pts = [];
  for (let i = N - 1; i >= 0; i--) { const dt = addDays(t, -i); const d = getDay(dt); pts.push({ dt, d: d.checkedIn ? d : null }); }
  if (!pts.some(p => p.d)) return '<div class="empty">Log your first check-in on the Today screen and your pain trend will appear here.</div>';
  const x = i => L + i * (W - L - R) / (N - 1), y = v => T + (10 - v) * (H - T - B) / 10;
  const line = side => { let s = '', pen = false; pts.forEach((p, i) => { if (p.d) { s += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.d['pain' + side] || 0).toFixed(1) + ' '; pen = true; } else pen = false; }); return s; };
  const dots = (side, col) => pts.map((p, i) => p.d ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.d['pain' + side] || 0).toFixed(1)}" r="3.5" fill="${col}"><title>${fmtShort(p.dt)} · ${side === 'L' ? 'Left' : 'Right'} ${p.d['pain' + side] || 0}/10</title></circle>` : '').join('');
  const grid = [0, 2, 4, 6, 8, 10].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join('');
  const yl = [0, 2, 4, 6, 8, 10].map(v => `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const xl = pts.map((p, i) => (i % 7 === 2 || i === N - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmtShort(p.dt)}</text>` : '').join('');
  const zone = `<rect x="${L}" y="${y(2)}" width="${W - L - R}" height="${y(0) - y(2)}" fill="var(--good)" opacity=".08"/><rect x="${L}" y="${y(5)}" width="${W - L - R}" height="${y(2) - y(5)}" fill="var(--warn)" opacity=".07"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pain over the last 30 days for both knees">${zone}<g class="grid">${grid}</g><g class="axis">${yl}${xl}</g>
    <path d="${line('L')}" fill="none" stroke="var(--left)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('R')}" fill="none" stroke="var(--right)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
    ${dots('L', 'var(--left)')}${dots('R', 'var(--right)')}</svg></div>
    <div class="legend"><span><i style="background:var(--left)"></i>Left knee</span><span><i style="background:var(--right)"></i>Right knee (dashed)</span><span><i style="background:var(--good);opacity:.4"></i>0–2 safe zone</span></div>`;
}
function weekBars() {
  const t = today(), W = 400, H = 180, L = 22, R = 6, T = 18, B = 24, n = 8;
  const mon = mondayOf(t), data = [];
  for (let k = n - 1; k >= 0; k--) { const m = addDays(mon, -7 * k); let c = 0; for (let i = 0; i < 7; i++) { const x = addDays(m, i); if (x > t) break; if (typeFor(x) !== 'recovery' && dayPct(x) >= 0.5) c++; } data.push({ m, c }); }
  const bw = (W - L - R) / n, y = v => T + (6 - v) * (H - T - B) / 6;
  const bars = data.map((d, i) => { const h = y(0) - y(d.c); const x = L + i * bw + bw * 0.2; return `<rect x="${x.toFixed(1)}" y="${y(d.c).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="5" fill="${i === n - 1 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 45%, var(--surface-2))'}"/><text x="${(x + bw * 0.3).toFixed(1)}" y="${(y(d.c) - 5).toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-size="12" font-family="var(--f-mono)">${d.c}</text><text x="${(x + bw * 0.3).toFixed(1)}" y="${H - 6}" text-anchor="middle">${fmtShort(d.m)}</text>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Training days completed per week, last 8 weeks"><g class="grid"><line x1="${L}" x2="${W - R}" y1="${y(6)}" y2="${y(6)}" stroke-dasharray="4 4"/><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></g><g class="axis"><text x="${L - 6}" y="${y(6) + 4}" text-anchor="end">6</text><text x="${L - 6}" y="${y(0) + 4}" text-anchor="end">0</text>${bars}</g></svg></div><p class="small muted">Weeks start Monday. Target: 6 training days (dashed line). A day counts when at least half its sets are ticked.</p>`;
}
function heatmap() {
  const t = today(), s = startDate(), first = mondayOf(s);
  const weeks = Math.max(16, Math.ceil((diff(first, t) + 1) / 7));
  let cells = '';
  for (let k = 0; k < weeks * 7; k++) {
    const dt = addDays(first, k), d = getDay(dt), pct = dayPct(dt);
    let lvl = 0; if (pct >= 0.8) lvl = 3; else if (pct > 0) lvl = 2; else if (d.checkedIn) lvl = 1;
    const cls = ['c', lvl ? 'l' + lvl : '', dt === t ? 'today' : '', dt > t || dt < s ? 'future' : ''].join(' ');
    cells += `<button class="${cls}" data-act="goto" data-date="${dt}" title="${fmtShort(dt)}: ${lvl === 3 ? 'session done' : lvl === 2 ? 'partly done' : lvl === 1 ? 'checked in' : 'nothing logged'}" aria-label="${fmtShort(dt)}"></button>`;
  }
  return `<div class="heat-wrap"><div class="heat-days">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="heat">${cells}</div></div>
    <div class="heat-legend">Less <span class="c" style="background:var(--surface-2)"></span><span class="c" style="background:color-mix(in srgb, var(--accent) 25%, var(--surface-2))"></span><span class="c" style="background:color-mix(in srgb, var(--accent) 55%, var(--surface-2))"></span><span class="c" style="background:var(--accent)"></span> More · tap a day to open it</div>`;
}
const lsiCls = v => v >= 90 ? 'good' : v >= 80 ? 'warn' : 'bad';
function testsCard() {
  const rows = [...S.settings.tests].map((e, i) => ({ e, i })).sort((a, b) => b.e.date.localeCompare(a.e.date));
  const cell = (v) => { if (v && v.B != null) return `<td><span class="num">${v.B}</span></td>`; if (!v || (v.L == null && v.R == null)) return '<td class="muted">–</td>'; const l = +v.L || 0, r = +v.R || 0; const lsi = Math.max(l, r) ? Math.round(Math.min(l, r) / Math.max(l, r) * 100) : null; return `<td><span class="num">${v.L ?? '–'} / ${v.R ?? '–'}</span>${lsi != null ? ` <span class="chip ${lsiCls(lsi)} lsi">${lsi}%</span>` : ''}</td>`; };
  return `<section class="card" aria-labelledby="tT">

    <p class="small muted">Do the tests when fresh, after a warm-up. Hop tests only from Phase 4: hop forward on one leg and stick the landing; measure from your toe at take-off to your heel on landing. Leave a box empty if you didn't do that test.</p>

}

    <div class="kpi"><span class="eyebrow">Check-in streak</span><span class="v">${st.streak}<small> days</small></span></div>

    ${runCard}
  </div>
  <div class="grid-2">${dropCard}${flagCard}</div>
  ${testsCard()}`;
}

/* ---------- Settings ---------- */
function viewSettings() {
  return `
  <header class="page-head"><div><div class="eyebrow">Program, data and reminders</div><h1>Settings</h1></div></header>
  <section class="card"><h2>Program</h2>
    <div class="grid-2">
      <div style="display:grid;gap:6px"><label class="field-label" for="startDate">Start date (week 1, day 1)</label><input type="date" id="startDate" value="${startDate()}" max="${today()}"></div>
      <div style="display:grid;gap:6px"><label class="field-label" for="phaseSel">Current phase</label><select id="phaseSel">${PHASES.map(p => `<option value="${p.n}" ${p.n === S.settings.phase ? 'selected' : ''}>Phase ${p.n}: ${p.name} (${p.weeks})</option>`).join('')}</select></div>
    </div>
    <p class="small muted">Normally you move phases from Progress once the criteria are met. Use this if your physiotherapist or orthopedist puts you at a different stage.</p>
    <label class="toggle" for="autoRest"><span><b>Start the rest timer automatically</b><br><span class="small muted">When you tick a set, the timer counts your rest (60 s for strength, 90 s for jumps).</span></span><input type="checkbox" id="autoRest" ${S.settings.autoRest !== false ? 'checked' : ''}></label>
  </section>
  <section class="card"><h2>Your data</h2>
    ${syncLine()}
    <p class="small muted">${cloud.mode === 'cloud' ? 'Check-ins and progress are stored privately in your Claude account, so they appear on any device where you open this page while signed in. Nobody else can see them.' : 'Progress is stored on this device and works fully offline. Export a backup now and then, because clearing Safari website data erases it.'}</p>
    <div class="row" style="justify-content:flex-start"><button class="btn ghost" data-act="export">Export backup (.json)</button><label class="btn ghost" for="importFile" style="cursor:pointer">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    ${ui.json ? `<div style="display:grid;gap:8px"><p class="small muted">Downloads aren't available here. Copy this text and keep it in Notes or Files:</p><textarea id="jsonOut" readonly rows="5">${esc(ui.json)}</textarea><div><button class="btn sm ghost" data-act="copy-json">Copy</button></div></div>` : ''}
  </section>
  <section class="card"><h2>Reminders and home screen</h2>
    <p>Web pages can't send notifications on iPad, so use these instead:</p>
    <ul class="bul">
      <li><b>Daily reminder:</b> add a repeating daily reminder in the Reminders app and paste this page's link into it, so tapping the reminder opens the app.</li>
      <li><b>App icon:</b> in Safari, tap Share and then <b>Add to Home Screen</b>. It opens full screen like an app and works with no internet. Updates arrive automatically the next time you open it online.</li>
      <li><b>During sessions:</b> the timer at the bottom right keeps your screen awake and beeps at the end of each hold or rest.</li>
    </ul>
  </section>
  <section class="card"><h2>Start over</h2>
    <p class="small muted">Erases every check-in, test result and setting, on all your devices.</p>
    <div class="row" style="justify-content:flex-start">${ui.resetArm ? '<button class="btn danger" data-act="reset-go">Yes, erase everything</button><button class="btn ghost" data-act="reset-cancel">Cancel</button>' : '<button class="btn danger" data-act="reset-arm">Erase all data…</button>'}</div>
  </section>`;
}

/* ---------- Exercise sheet ---------- */
let lastFocus = null, sheetCtx = null;
function holdSecs(dose) {
  const m = String(dose || '').match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*s\b/);
  if (!m) return [];
  return [+m[1], m[2] ? +m[2] : null].filter(Boolean).filter(n => n >= 10 && n <= 120);
}
function openEx(id, dose, ctx) {
  const e = EX[id]; if (!e) return;
  if ($('#sheet').hidden) lastFocus = document.activeElement;
  sheetCtx = { id, dose, ctx };
  const ph = exPhases(id);
  const onDay = ctx === 'today' && ui.date <= today();
  const flagged = onDay && (getDay(ui.date).flags || {})[id];
  const holds = holdSecs(dose), rest = restFor(id);
  const hist = LOADED.has(id) ? Object.keys(S.days).filter(k => S.days[k].load && S.days[k].load[id] != null).sort().slice(-5).reverse() : [];
  $('#sheetPanel').innerHTML = `
    <div class="row" style="align-items:flex-start"><div style="display:flex;gap:12px;align-items:center"><span class="cat-ico">${IC[e.cat] || ''}</span><div><div class="eyebrow">${esc(e.cat)} · ${phaseRange(ph)}</div><div class="small muted">${esc(e.target)}</div></div></div><button class="icon-btn" data-act="close-sheet" aria-label="Close">${IC.close}</button></div>
    <h2 id="sheetTitle">${esc(e.name)}</h2>
    ${dose || rest || holds.length ? `<div class="hold-row">${dose ? `<span class="chip accent">Prescribed: ${esc(dose)}</span>` : ''}${rest ? `<span class="chip">Rest ${rest} s between sets</span>` : ''}${holds.map(s => `<button class="btn sm" data-act="hold" data-s="${s}">Start ${s} s timer</button>`).join('')}</div>` : ''}
    ${onDay ? `<button class="btn ${flagged ? 'danger' : 'ghost'} sm" data-act="flag" data-ex="${id}" aria-pressed="${!!flagged}" style="justify-self:start">${flagged ? 'Flagged: bothered my knee today (tap to undo)' : 'This bothered my knee today'}</button>` : ''}
    ${flagged ? `<div class="notice warn"><b>Use the easier version next time</b><span class="small">${esc(e.easier || 'Reduce the load or range.')} If it still bothers you, skip it for a week.</span></div>` : ''}
    ${hist.length ? `<div class="mini"><b>Weight history</b><span class="small num">${hist.map(k => `${fmtShort(k)}: ${S.days[k].load[id]} kg`).join(' · ')}</span></div>` : ''}
    <div class="why"><div class="eyebrow" style="color:var(--accent)">Why it matters for your knees</div><p>${esc(e.why)}</p></div>
    <div style="display:grid;gap:6px"><h3>Setup</h3><p>${esc(e.setup)}</p></div>
    <div style="display:grid;gap:10px"><h3>How to do it</h3><ol class="steps">${e.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol></div>
    ${id === 'run-program' ? `<div style="display:grid;gap:4px"><h3>Stages</h3>${RUN.map((r, i) => `<div class="stage ${i < S.settings.runStage ? 'done' : ''} ${i === S.settings.runStage ? 'cur' : ''}"><span class="b">${i + 1}</span><span class="t">${r.d}</span></div>`).join('')}</div>` : ''}
    ${id === 'depth-drop' ? `<div style="display:grid;gap:4px"><h3>Ladder</h3>${DROP.map((r, i) => `<div class="stage ${i < dropStage() ? 'done' : ''} ${i === dropStage() && dropMax(S.settings.phase) >= 0 ? 'cur' : ''}"><span class="b">${i + 1}</span><span class="t">${r.l}: ${esc(r.d)} <span class="muted small">(from Phase ${r.min})</span></span></div>`).join('')}</div>` : ''}
    <div class="two"><div class="mini"><b>What you should feel</b><ul class="bul small">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div><div class="mini"><b>Common mistakes</b><ul class="bul small">${e.avoid.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div></div>
    ${e.easier || e.harder ? `<div class="two">${e.easier ? `<div class="mini"><b>Make it easier</b><span class="small">${esc(e.easier)}</span></div>` : ''}${e.harder ? `<div class="mini"><b>Make it harder</b><span class="small">${esc(e.harder)}</span></div>` : ''}</div>` : ''}
    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">Watch demo videos on YouTube ↗</a>`;
  $('#sheet').hidden = false;
  $('#sheetPanel').scrollTop = 0;
  setTimeout(() => { const b = $('#sheetPanel [data-act="close-sheet"]'); b && b.focus(); }, 30);
}
function closeSheet() { $('#sheet').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

/* ---------- Timer ---------- */
const tm = { end: 0, id: null, ctx: null, lock: null };
function renderTimer() {
  const el = $('#timer');
  el.hidden = ui.view !== 'today';
  if (tm.end) {
    const left = Math.max(0, Math.ceil((tm.end - Date.now()) / 1000));
    el.className = 'timer running';
    el.innerHTML = `<span class="timer-lab">${esc(tm.label || '')}</span><span class="clock" aria-live="off">${Math.floor(left / 60)}:${pad(left % 60)}</span><button data-act="timer-stop">${tm.label === 'Rest' ? 'Skip' : 'Stop'}</button>`;
  } else {
    el.className = 'timer';
    el.innerHTML = `<span class="timer-ico">${IC.timer}</span>${[30, 45, 60, 90].map(s => `<button data-act="timer" data-s="${s}" aria-label="Start ${s} second timer">${s}s</button>`).join('')}`;
  }
}
function beep(n = 3) {
  try { const c = tm.ctx; if (!c) return; for (let i = 0; i < n; i++) { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); const t0 = c.currentTime + i * 0.25; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18); o.start(t0); o.stop(t0 + 0.2); } } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch (e) {}
}
async function startTimer(s, label = '') {
  tm.label = label;
  try { tm.ctx = tm.ctx || new (window.AudioContext || window.webkitAudioContext)(); tm.ctx.resume && tm.ctx.resume(); } catch (e) {}
  try { if ('wakeLock' in navigator && !tm.lock) tm.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  tm.end = Date.now() + s * 1000; clearInterval(tm.id);
  tm.id = setInterval(() => { if (Date.now() >= tm.end) { const l = tm.label; stopTimer(); beep(); toast(l === 'Rest' ? 'Rest over. Next set.' : 'Time!'); } else renderTimer(); }, 250);
  renderTimer();
}
function stopTimer() { clearInterval(tm.id); tm.end = 0; try { tm.lock && tm.lock.release(); } catch (e) {} tm.lock = null; renderTimer(); }

/* ---------- Toast ---------- */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- Render ---------- */
function render() {
  renderNav(); renderRail(); renderTimer();
  const y = window.scrollY;
  const v = { today: viewToday, plan: viewPlan, library: viewLibrary, progress: viewProgress, settings: viewSettings }[ui.view] || viewToday;
  $('#view').innerHTML = v();
  window.scrollTo(0, y);
}
function go(view) { ui.view = view; ui.resetArm = false; saveUi(); window.scrollTo(0, 0); render(); }

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act, date = ui.date;
  switch (act) {
    case 'nav': go(a.dataset.view); break;
    case 'day': { const n = +a.dataset.d; ui.date = n === 0 ? today() : addDays(ui.date, n); render(); break; }
    case 'goto': ui.date = a.dataset.date; go('today'); break;
    case 'set': {
      const id = a.dataset.ex, i = +a.dataset.i, sets = +a.dataset.sets || 1, d = getDay(date), done = { ...(d.done || {}) };
      const before = done[id] || 0;
      done[id] = before > i ? i : i + 1;
      setDay(date, { done }); render();
      if (dayPct(date) >= 1) toast('Session complete. Nice work.');
      else if (done[id] > before && done[id] < sets && S.settings.autoRest !== false && restFor(id)) startTimer(restFor(id), 'Rest');
      break;
    }
    case 'all-done': { const done = {}; blocksFor(date).forEach(b => b.items.forEach(i => { done[i.id] = i.sets; })); setDay(date, { done }); render(); toast('Session complete. Nice work.'); break; }
    case 'clear-done': setDay(date, { done: {} }); render(); break;
    case 'type': setDay(date, { type: a.dataset.type }); render(); break;
    case 'seg': setDay(date, { [a.dataset.field]: a.dataset.v }); render(); break;
    case 'log': setDay(date, { checkedIn: true, painL: getDay(date).painL || 0, painR: getDay(date).painR || 0 }); render(); toast('Check-in logged'); break;
    case 'open-ex': openEx(a.dataset.ex, a.dataset.dose, a.dataset.ctx); break;
    case 'hold': closeSheet(); startTimer(+a.dataset.s, 'Hold'); break;
    case 'flag': {
      const id = a.dataset.ex, f = { ...(getDay(date).flags || {}) };
      if (f[id]) delete f[id]; else f[id] = true;
      setDay(date, { flags: f }); render();
      const st = $('#sheetPanel').scrollTop; openEx(sheetCtx.id, sheetCtx.dose, sheetCtx.ctx); $('#sheetPanel').scrollTop = st;
      break;
    }
    case 'drop': setSettings({ dropStage: Math.max(0, Math.min(dropMax(S.settings.phase), dropStage() + +a.dataset.d)) }); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'timer': startTimer(+a.dataset.s, ''); break;
    case 'timer-stop': stopTimer(); break;
    case 'lib-phase': ui.libPhase = a.dataset.v; render(); break;
    case 'lib-cat': ui.libCat = a.dataset.v; render(); break;
    case 'plan-phase': ui.planPhase = +a.dataset.p; render(); break;
    case 'advance': if (S.settings.phase < 5) { setSettings({ phase: S.settings.phase + 1 }); render(); toast(`Welcome to Phase ${S.settings.phase}: ${PHASES[S.settings.phase - 1].name}`); } break;
    case 'run': setSettings({ runStage: Math.max(0, Math.min(RUN.length - 1, S.settings.runStage + +a.dataset.d)) }); render(); break;
    case 'save-test': {
      const v = {}; let any = false;
      TESTS.forEach(x => {
        const l = $(`#t-${x.k}-L`).value;
        if (x.both) { if (l !== '') { v[x.k] = { B: +l }; any = true; } return; }
        const r = $(`#t-${x.k}-R`).value; if (l !== '' || r !== '') { v[x.k] = { L: l === '' ? null : +l, R: r === '' ? null : +r }; any = true; }
      });
      if (!any) { toast('Enter at least one result first'); break; }
      const tests = S.settings.tests.filter(e => e.date !== today()); const prev = S.settings.tests.find(e => e.date === today());
      tests.push({ date: today(), v: { ...(prev ? prev.v : {}), ...v } });
      setSettings({ tests }); ensureStart(); render(); toast('Results saved'); break;
    }
    case 'del-test': { const tests = S.settings.tests.filter((e, i) => i !== +a.dataset.i); setSettings({ tests }); render(); break; }
    case 'export': {
      const data = JSON.stringify({ app: 'knee-comeback', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, days: S.days }, null, 2);
      let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
      if (dl) { try { await dl.save({ filename: `knee-comeback-${today()}.json`, data }); toast('Backup saved'); } catch (e) { if (e && e.code !== 'declined') { ui.json = data; render(); } } }
      else { try { const u = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const l = document.createElement('a'); l.href = u; l.download = `knee-comeback-${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); ui.json = data; render(); toast('Backup downloaded'); } catch (e) { ui.json = data; render(); } }
      break;
    }
    case 'copy-json': { const ta = $('#jsonOut'); try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (e) { ta.select(); toast('Selected. Use Copy from the menu'); } break; }
    case 'reset-arm': ui.resetArm = true; render(); break;
    case 'reset-cancel': ui.resetArm = false; render(); break;
    case 'reset-go': {
      const ids = new Set([...cloud.ids, 'settings', ...Object.keys(S.days).map(monthId)]);
      S = { settings: defaults(), days: {} }; dirty.clear(); saveLocal(); ui.resetArm = false;
      if (cloud.col && cloud.mode === 'cloud') for (const id of ids) { try { await cloud.col.doc(id).delete(); } catch (e) {} }
      cloud.ids.clear(); go('today'); toast('All data erased'); break;
    }
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.pain) {
    const side = el.dataset.pain, v = +el.value;
    setDay(ui.date, { ['pain' + side]: v });
    const pv = $('#pv' + side); if (pv) pv.innerHTML = `${v}<small>/10</small>`;
    const vd = verdict(getDay(ui.date)), box = $('#verdict');
    if (box) { box.className = 'verdict ' + vd.c; box.innerHTML = `<span class="light"></span><div><b>${vd.t}</b><span class="small">${vd.m}</span></div>`; }
  } else if (el.dataset.rpe) {
    setDay(ui.date, { rpe: +el.value }); const r = $('#rpeV'); if (r) r.textContent = el.value + '/10';
  } else if (el.id === 'libQ') {
    ui.q = el.value; $('#libGrid').innerHTML = libGrid();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.notes) setDay(ui.date, { notes: el.value.slice(0, 2000) });
  else if (el.dataset.kg) {
    const load = { ...(getDay(ui.date).load || {}) }, v = parseFloat(el.value);
    if (el.value === '' || isNaN(v)) delete load[el.dataset.kg]; else load[el.dataset.kg] = Math.max(0, Math.min(500, v));
    setDay(ui.date, { load });
  }
  else if (el.id === 'autoRest') { setSettings({ autoRest: el.checked }); toast(el.checked ? 'Rest timer starts automatically' : 'Rest timer is manual'); }
  else if (el.dataset.crit) { setSettings({ criteria: { ...S.settings.criteria, [el.dataset.crit]: el.checked } }); render(); }
  else if (el.id === 'startDate' && el.value) { setSettings({ startDate: el.value }); render(); toast('Start date updated'); }
  else if (el.id === 'phaseSel') { setSettings({ phase: +el.value }); render(); toast('Phase updated'); }
  else if (el.id === 'importFile' && el.files[0]) {
    const f = el.files[0], rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o || typeof o !== 'object' || !o.days || !o.settings) throw new Error('bad');
        S = { settings: normSettings(o.settings), days: o.days }; S.settings.ts = Date.now();
        Object.values(S.days).forEach(d => { d.ts = Date.now(); });
        saveLocal(); markAll(); render(); toast('Backup imported');
      } catch (e) { toast('That file isn’t a Knee Comeback backup'); }
    };
    rd.readAsText(f);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    if (tm.end && !tm.lock) { try { tm.lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
    if (ui.view === 'today' && ui.date < today() && !tm.end) { /* keep the chosen date */ }
  } else { tm.lock = null; }
});

/* ---------- Boot ---------- */
loadLocal();
render();
initCloud();


if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }

</script>
</body></html>
