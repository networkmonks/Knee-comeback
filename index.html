        <li><span><b>Jumps while fresh.</b> Tired legs land stiffer, with the knee caving in, which is the classic ACL injury pattern. Jumps always come before strength work, never after.</span></li>
        <li><span><b>Jumps from easiest to hardest.</b> Lowest landing force first, two legs before one, forward before sideways.</span></li>
        <li><span><b>Big lifts before small ones.</b> Exercises done early in a session get more reps at better quality, so the most important multi-joint lifts (squats, deadlifts) come first.</span></li>
        <li><span><b>Control drills before fatigue.</b> Step-downs train knee alignment, which is easiest to learn before you are tired.</span></li>
        <li><span><b>Hamstring eccentrics after jumps.</b> Nordics temporarily weaken the hamstrings that protect the ACL on landing, so they never come before a jump block.</span></li>
        <li><span><b>Long holds, calves and core last.</b> Endurance work tires the muscles, so it goes where it can't spoil the technique of anything after it.</span></li>
        <li><span><b>Static stretches at the end.</b> Long static stretches before power work reduce jump performance; after training they are fine.</span></li>
        <li><span><b>Run days.</b> Balance before the run while fresh; fast agility work before the steady run.</span></li>
        <li><span><b>Minis.</b> Activation or balance first, then the main quad hold, then the hamstrings, then the lighter single-joint work.</span></li>
        <li><span><b>Through the day.</b> Loading sessions are spaced at least 6 hours apart; gentle movement snacks fill the gaps, so tissues get a fresh signal each time without piling up fatigue.</span></li>
      </ol>
      <p class="small muted">Sources this draws on: Rice & McNair 2010 (quadriceps inhibition); Rio et al. 2015 (isometric holds and knee pain); Baar 2017 and Shaw et al. 2017 (short loading bouts 6 h apart, collagen with vitamin C); motor-learning research on spaced practice; Simão et al. 2012 (exercise order); Benjaminse et al. 2019 (fatigue and landing); Behm et al. 2016 (static stretching and power).</p>
    </section>
  </div>
  <div class="grid-2">
    <section class="card"><div><div class="eyebrow">The 0–10 rule</div><h2>How much pain is OK?</h2></div>

      <div class="verdict red"><span class="light"></span><div><b>6+, swelling, or worse next morning: back off</b><span class="small">Drop to the previous level or a recovery day for 2–3 days.</span></div></div>
    </section>
    <section class="card"><div><div class="eyebrow">Protect the meniscus and ACL</div><h2>Avoid for now</h2></div>

    </section>
  </div>
  <div class="grid-2">

    </section>
    <section class="card"><div><div class="eyebrow">Your goals</div><h2>Running, sport, off-road riding</h2></div>

    </section>
  </div>
  <section class="card"><div><div class="eyebrow">Off-road riding</div><h2>Back on the bike</h2></div>
    <div class="grid-2">
      <div style="display:grid;gap:10px;min-width:0"><h3>How to stand on the pegs</h3>
        <ol class="rules">
          <li><span><b>Grip the tank with your knees and inner thighs.</b> This switches on the adductors and hamstrings and stops the knee twisting inward if the front wheel deflects off a rock.</span></li>
          <li><span><b>Hinge at the hips, not just the knees.</b> Keep your backside slightly back so the glutes absorb big hits, and never let the knees bottom out past 90°.</span></li>
          <li><span><b>Stay on the balls of your feet.</b> Ankles are your first suspension, just like in pogo hops.</span></li>
          <li><span><b>Keep both feet on the pegs.</b> Dabbing a foot down with a straight, planted leg while the bike moves is the classic twist that tears an ACL or meniscus. If you must dab, keep the knee bent and the foot moving.</span></li>
          <li><span><b>Sit down when your thighs burn.</b> Fatigue is when knees cave in. Stop and rest rather than ride on tired legs.</span></li>
        </ol>
      </div>

          <li><span>1 h smooth dirt or gravel, no jumps.</span></li>
          <li><span>2–3 h mixed trails, small obstacles.</span></li>
          <li><span>Technical trails and small jumps, once 2 ft drop landings feel automatic.</span></li>
        </ol>

    </div>

    </div>

  </section>`;
}

      ${Object.keys(r.flags).length ? `<p class="small"><b>Bothered a knee:</b> ${Object.entries(r.flags).map(([id, n]) => `${esc(EX[id].name)} (${n})`).join(', ')}</p>` : ''}
    </section>
  </div>
  ${r.notes.length ? `<section class="card"><div><div class="eyebrow">From your check-ins</div><h2>Notes</h2></div><ul class="bul small">${r.notes.map(o => `<li><b>${fmtShort(o.x)}:</b> ${esc(o.n)}</li>`).join('')}</ul></section>` : ''}
  <section class="card"><div><div class="eyebrow">Take these with you</div><h2>Questions to ask</h2></div>
    <ol class="bul">${DOCTOR_QS.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
    <label class="field-label" for="docQs">Your own questions, one per line</label>
    <textarea id="docQs" data-docqs="1" rows="3" placeholder="e.g. Can I play football again by March?">${esc(S.settings.docQs || '')}</textarea>
  </section>`;
}

/* ---------- Calendar export (.ics) ---------- */
function icsText() {
  const P = PHASES[S.settings.phase - 1], sched = schedFor(S.settings.phase);
  const [hh, mm] = (S.settings.remindTime || '19:00').split(':').map(Number);
  const codes = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const groups = { strength: [], cond: [], recovery: [], rest: [] };
  for (let wd = 0; wd < 7; wd++) groups[sched[wd]].push(wd);
  const names = { strength: 'Knee rehab: strength', cond: `Knee rehab: ${condLabel(P.n).toLowerCase()}`, recovery: 'Knee rehab: recovery & mobility' };
  const dur = { strength: 'PT60M', cond: 'PT45M', recovery: 'PT20M' };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const link = /^https?:/.test(location.href) ? location.href.split('#')[0] : '';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Knee Comeback//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Knee rehab'];
  Object.entries(groups).forEach(([type, wds]) => {
    if (!wds.length || type === 'rest' || (type === 'recovery' && !S.settings.remindSun)) return;
    let first = today(); for (let k = 0; k < 7; k++) { const x = addDays(today(), k); if (wds.includes(parse(x).getDay())) { first = x; break; } }
    const ds = first.replace(/-/g, '') + 'T' + pad(hh) + pad(mm) + '00';
    L.push('BEGIN:VEVENT', `UID:knee-comeback-${type}-${Date.now()}@knee-comeback`, `DTSTAMP:${stamp}`, `DTSTART:${ds}`, `DURATION:${dur[type]}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${wds.map(w => codes[w]).join(',')}`, `SUMMARY:${names[type]}`,
      `DESCRIPTION:Open Knee Comeback\\, do your check-in and start the guided session.${link ? '\\n' + link : ''}`, ...(link ? [`URL:${link}`] : []),
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${names[type]}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
function downloadFile(name, text, type) {
  const u = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}

/* ---------- Toast ---------- */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- Render ---------- */
function render() {
  renderNav(); renderRail(); renderTimer();
  const y = window.scrollY;
  const v = { today: viewToday, plan: viewPlan, library: viewLibrary, progress: viewProgress, settings: viewSettings, report: viewReport }[ui.view] || viewToday;
  $('#view').innerHTML = v();
  window.scrollTo(0, y);
}
function go(view) { if (guide.open) closeGuide(); ui.view = view; ui.resetArm = false; ui.repText = null; saveUi(); window.scrollTo(0, 0); render(); }

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act, date = ui.date;
  switch (act) {
    case 'nav': { if (!$('#sheet').hidden) closeSheet(); go(a.dataset.view); const an = a.dataset.anchor; if (an) setTimeout(() => { const el = document.getElementById(an); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); break; }
    case 'day': { const n = +a.dataset.d; ui.date = n === 0 ? today() : addDays(ui.date, n); render(); break; }
    case 'goto': ui.date = a.dataset.date; go('today'); break;
    case 'set': {
      const id = a.dataset.ex, i = +a.dataset.i, sets = +a.dataset.sets || 1, d = getDay(date), done = { ...(d.done || {}) };
      const before = done[id] || 0;
      done[id] = before > i ? i : i + 1;
      setDay(date, { done, ...(date === today() && isTraining(typeFor(date)) && !d.mainAt && done[id] > before ? { mainAt: Date.now() } : {}) }); render();
      if (dayPct(date) >= 1) toast('Session complete. Nice work.');
      else if (done[id] > before && done[id] < sets && S.settings.autoRest !== false && restFor(id)) startTimer(restFor(id), 'Rest');
      break;
    }
    case 'all-done': { const done = {}; itemsFor(date).forEach(i => { done[i.id] = i.sets; }); setDay(date, { done }); render(); toast('Session complete. Nice work.'); break; }
    case 'clear-done': setDay(date, { done: {} }); render(); break;
    case 'type': setDay(date, { type: a.dataset.type }); render(); break;
    case 'type-reset': setDay(date, { type: null }); render(); break;
    case 'day-reset': setDay(date, { type: null, skip: {}, extra: [], order: [] }); if (!$('#sheet').hidden && ui.editDate) openDayEditor(ui.editDate); render(); toast('Day reset to the plan'); break;
    case 'day-edit': openDayEditor(date); break;
    case 'ed-type': { const ty = a.dataset.v; setDay(ui.editDate, { type: ty === plannedType(ui.editDate) ? null : ty, skip: {}, extra: [], order: [] }); render(); openDayEditor(ui.editDate, true); break; }
    case 'ed-move': {
      const all = itemsFor(ui.editDate, true).map(i => i.id), k = all.indexOf(a.dataset.ex), j = k + +a.dataset.d;
      if (k < 0 || j < 0 || j >= all.length) break;
      [all[k], all[j]] = [all[j], all[k]]; setDay(ui.editDate, { order: all }); render(); openDayEditor(ui.editDate, true); break;
    }
    case 'ed-remove': {
      const id = a.dataset.ex, d0 = getDay(ui.editDate);
      if ((d0.extra || []).some(x => x[0] === id)) setDay(ui.editDate, { extra: d0.extra.filter(x => x[0] !== id), order: (d0.order || []).filter(x => x !== id) });
      else { const sk = { ...(d0.skip || {}) }; if (sk[id]) delete sk[id]; else sk[id] = true; setDay(ui.editDate, { skip: sk }); }
      render(); openDayEditor(ui.editDate, true); break;
    }
    case 'ed-add': {
      const sel = $('#edAdd'), id = sel && sel.value; if (!id || !EX[id]) { toast('Pick an exercise to add first'); break; }
      const ed = ui.editDate, d0 = getDay(ed), a0 = defaultDose(id, phaseFor(ed)), sets = +($('#edSets') || {}).value || a0[1];
      const all = itemsFor(ed, true).map(i => i.id), cd = itemsFor(ed, true).findIndex(i => /^Cool-down|^Mobility/.test(i.block));
      const order = [...all]; order.splice(cd < 0 ? order.length : cd, 0, id);
      setDay(ed, { extra: [...(d0.extra || []).filter(x => x[0] !== id), [id, sets, a0[2], a0[3]]], order, skip: Object.fromEntries(Object.entries(d0.skip || {}).filter(([k]) => k !== id)) });
      render(); openDayEditor(ed, true); toast(`${EX[id].name} added`); break;
    }
    case 'week-reset': { const g = a.dataset.g, w = { ...(S.settings.week || {}) }; delete w[g]; setSettings({ week: w }); render(); toast('Weekly schedule reset to the recommended one'); break; }
    case 'seg': setDay(date, { [a.dataset.field]: a.dataset.v }); render(); break;
    case 'log': setDay(date, { checkedIn: true, painL: getDay(date).painL || 0, painR: getDay(date).painR || 0 }); render(); toast('Check-in logged'); break;
    case 'open-ex': openEx(a.dataset.ex, a.dataset.dose, a.dataset.ctx); break;
    case 'hold': closeSheet(); startTimer(+a.dataset.s, 'Hold'); break;
    case 'flag': {
      const id = a.dataset.ex, f = { ...(getDay(date).flags || {}) };
      if (f[id]) delete f[id]; else f[id] = true;
      setDay(date, { flags: f }); render();
      const st = $('#sheetPanel').scrollTop; openEx(sheetCtx.id, sheetCtx.dose, sheetCtx.ctx); $('#sheetPanel').scrollTop = st;
      break;
    }
    case 'drop': setSettings({ dropStage: Math.max(0, Math.min(dropMax(S.settings.phase), dropStage() + +a.dataset.d)) }); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'timer': startTimer(+a.dataset.s, ''); break;
    case 'timer-stop': stopTimer(); break;
    case 'lib-phase': ui.libPhase = a.dataset.v; render(); break;
    case 'lib-cat': ui.libCat = a.dataset.v; render(); break;
    case 'plan-phase': ui.planPhase = +a.dataset.p; render(); break;
    case 'advance': if (S.settings.phase < PHASES.length && !PHASES[S.settings.phase - 1].habits) { setSettings({ phase: S.settings.phase + 1 }); render(); toast(`Welcome to Phase ${S.settings.phase}: ${PHASES[S.settings.phase - 1].name}`); } break;
    case 'run': setSettings({ runStage: Math.max(0, Math.min(RUN.length - 1, S.settings.runStage + +a.dataset.d)) }); render(); break;
    case 'save-test': {
      const v = {}; let any = false;
      TESTS.forEach(x => {
        const l = $(`#t-${x.k}-L`).value;
        if (x.both) { if (l !== '') { v[x.k] = { B: +l }; any = true; } return; }
        const r = $(`#t-${x.k}-R`).value; if (l !== '' || r !== '') { v[x.k] = { L: l === '' ? null : +l, R: r === '' ? null : +r }; any = true; }
      });
      if (!any) { toast('Enter at least one result first'); break; }
      const tests = S.settings.tests.filter(e => e.date !== today()); const prev = S.settings.tests.find(e => e.date === today());
      tests.push({ date: today(), v: { ...(prev ? prev.v : {}), ...v } });
      setSettings({ tests }); ensureStart(); render(); toast('Results saved'); break;
    }
    case 'del-test': { const tests = S.settings.tests.filter((e, i) => i !== +a.dataset.i); setSettings({ tests }); render(); break; }
    case 'export': {
      setSettings({ lastExport: today() });
      const data = JSON.stringify({ app: 'knee-comeback', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, days: S.days }, null, 2);
      let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
      if (dl) { try { await dl.save({ filename: `knee-comeback-${today()}.json`, data }); toast('Backup saved'); } catch (e) { if (e && e.code !== 'declined') { ui.json = data; render(); } } }
      else { try { const u = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const l = document.createElement('a'); l.href = u; l.download = `knee-comeback-${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); ui.json = data; render(); toast('Backup downloaded'); } catch (e) { ui.json = data; render(); } }
      break;
    }
    case 'copy-json': { const ta = $('#jsonOut'); try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (e) { ta.select(); toast('Selected. Use Copy from the menu'); } break; }
    case 'guide-start': openGuide(); break;
    case 'mini-start': openGuide('mini'); break;
    case 'mini-done': recordMini(date); render(); toast('Mini session logged'); break;
    case 'snack-start': openGuide('snack'); break;
    case 'snack-done': recordSnack(date); render(); toast('Movement snack logged'); break;
    case 'extra-undo': {
      const d0 = getDay(date), m = [...(d0.minis || [])], sn = [...(d0.snacks || [])];
      const lm = m.length ? m[m.length - 1] : -1, ls = sn.length ? sn[sn.length - 1] : -1;
      if (lm >= ls) { m.pop(); setDay(date, { minis: m }); toast('Last mini session removed'); } else { sn.pop(); setDay(date, { snacks: sn }); toast('Last snack removed'); }
      render(); break;
    }
    case 'guide-close': closeGuide(); break;
    case 'g-done': guideDone(); break;
    case 'g-prev': guide.idx = Math.max(0, guide.idx - 1); guide.finished = false; renderGuide(); break;
    case 'g-skip': guideAdvance(); renderGuide(); break;
    case 'g-hold': startTimer(+a.dataset.s, 'Hold'); renderGuide(); break;
    case 'g-rpe': setDay(guide.date, { rpe: +a.dataset.v }); renderGuide(); toast('Effort saved'); break;
    case 'express': setDay(date, { express: !getDay(date).express }); render(); break;
    case 'deload': { const w = weekOf(date); setSettings({ deload: { ...S.settings.deload, [w]: a.dataset.v === '1' } }); render(); toast(a.dataset.v === '1' ? `Week ${w} is now a lighter week` : 'Back to normal training this week'); break; }
    case 'pause': {
      const sel = $('#breakReason'), reason = sel ? sel.value : 'other';
      setSettings({ breaks: [...S.settings.breaks.filter(b => b.end), { start: today(), end: null, reason }] });
      render(); toast('Plan paused. Look after yourself.'); break;
    }
    case 'resume': {
      const br = activeBreak(); if (!br) break;
      const days = diff(br.start, today());
      const breaks = S.settings.breaks.map(b => b === br ? { ...b, end: today() } : b);
      if (days < 1) { setSettings({ breaks: S.settings.breaks.filter(b => b !== br) }); render(); toast('Pause cancelled'); break; }
      setSettings({ breaks, lastResume: { date: today(), days, reason: br.reason } });
      if (days >= 7 && br.reason !== 'surgery') setSettings({ deload: { ...S.settings.deload, [weekOf(today())]: true } });
      render(); toast(`Welcome back after ${days} day${days > 1 ? 's' : ''}`); break;
    }
    case 'phase-back': if (S.settings.phase > 1) { setSettings({ phase: S.settings.phase - 1, lastResume: { ...S.settings.lastResume, days: 0 } }); render(); toast(`Back to Phase ${S.settings.phase} for a week`); } break;
    case 'conf-save': {
      const v = {}; CONF.forEach(q => { const el = $('#cf-' + q.k); v[q.k] = el ? +el.value : 5; });
      setSettings({ confidence: [...S.settings.confidence.filter(c => c.date !== today()), { date: today(), v }] });
      render(); toast('Confidence check saved'); break;
    }
    case 'rep-weeks': ui.repWeeks = +a.dataset.v; ui.repText = null; render(); break;
    case 'rep-share': case 'rep-copy': {
      const text = reportText(ui.repWeeks);
      if (act === 'rep-share' && OFFLINE && navigator.share) { try { await navigator.share({ title: 'Knee rehab summary', text }); break; } catch (e) { if (e && e.name === 'AbortError') break; } }
      try { await navigator.clipboard.writeText(text); toast('Report copied. Paste it into WhatsApp, Notes or email.'); }
      catch (e) { ui.repText = text; render(); setTimeout(() => { const t = $('#repOut'); if (t) { t.focus(); t.select(); } }, 50); toast('Select the text below and copy it'); }
      break;
    }
    case 'ics': {
      try { downloadFile('knee-rehab-schedule.ics', icsText(), 'text/calendar'); toast('Calendar file created'); } catch (e) { toast('Couldn\u2019t create the calendar file here'); }
      break;
    }
    case 'reset-arm': ui.resetArm = true; render(); break;
    case 'reset-cancel': ui.resetArm = false; render(); break;
    case 'reset-go': {
      const ids = new Set([...cloud.ids, 'settings', ...Object.keys(S.days).map(monthId)]);
      S = { settings: defaults(), days: {} }; dirty.clear(); saveLocal(); ui.resetArm = false;
      if (cloud.col && cloud.mode === 'cloud') for (const id of ids) { try { await cloud.col.doc(id).delete(); } catch (e) {} }
      cloud.ids.clear(); go('today'); toast('All data erased'); break;
    }
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.pain) {
    const side = el.dataset.pain, v = +el.value;
    setDay(ui.date, { ['pain' + side]: v });
    const pv = $('#pv' + side); if (pv) pv.innerHTML = `${v}<small>/10</small>`;
    const vd = verdict(getDay(ui.date)), box = $('#verdict');
    if (box) { box.className = 'verdict ' + vd.c; box.innerHTML = `<span class="light"></span><div><b>${vd.t}</b><span class="small">${vd.m}</span></div>`; }
  } else if (el.dataset.conf) {
    const o = $('#cfv-' + el.dataset.conf); if (o) o.textContent = el.value;
  } else if (el.dataset.rpe) {
    setDay(ui.date, { rpe: +el.value }); const r = $('#rpeV'); if (r) r.textContent = el.value + '/10';
  } else if (el.id === 'libQ') {
    ui.q = el.value; $('#libGrid').innerHTML = libGrid();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.notes) setDay(ui.date, { notes: el.value.slice(0, 2000) });
  else if (el.dataset.docqs) setSettings({ docQs: el.value.slice(0, 2000) });
  else if (el.dataset.week != null) {
    const ph = S.settings.phase, g = schedGroup(ph), cur = { ...schedFor(ph), [el.dataset.week]: el.value };
    setSettings({ week: { ...(S.settings.week || {}), [g]: cur } }); render(); toast('Weekly schedule updated');
  }
  else if (el.id === 'remTime' && el.value) setSettings({ remindTime: el.value });
  else if (el.id === 'remSun') setSettings({ remindSun: el.checked });
  else if (el.id === 'minisOn') { setSettings({ minisOn: el.checked }); toast(el.checked ? 'Mini sessions on' : 'Mini sessions off'); }
  else if (el.id === 'snacksOn') { setSettings({ snacksOn: el.checked }); toast(el.checked ? 'Movement snacks on' : 'Movement snacks off'); }
  else if (el.dataset.kg) {
    const load = { ...(getDay(ui.date).load || {}) }, v = parseFloat(el.value);
    if (el.value === '' || isNaN(v)) delete load[el.dataset.kg]; else load[el.dataset.kg] = Math.max(0, Math.min(500, v));
    setDay(ui.date, { load });
  }
  else if (el.id === 'autoRest') { setSettings({ autoRest: el.checked }); toast(el.checked ? 'Rest timer starts automatically' : 'Rest timer is manual'); }
  else if (el.dataset.crit) { setSettings({ criteria: { ...S.settings.criteria, [el.dataset.crit]: el.checked } }); render(); }
  else if (el.id === 'startDate' && el.value) { setSettings({ startDate: el.value }); render(); toast('Start date updated'); }
  else if (el.id === 'phaseSel') { setSettings({ phase: +el.value }); render(); toast('Phase updated'); }
  else if (el.id === 'importFile' && el.files[0]) {
    const f = el.files[0], rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o || typeof o !== 'object' || !o.days || !o.settings) throw new Error('bad');
        S = { settings: normSettings(o.settings), days: o.days }; S.settings.ts = Date.now();
        Object.values(S.days).forEach(d => { d.ts = Date.now(); });
        saveLocal(); markAll(); render(); toast('Backup imported');
      } catch (e) { toast('That file isn’t a Knee Comeback backup'); }
    };
    rd.readAsText(f);
  }
});
document.addEventListener('keydown', ev => { if (ev.key !== 'Escape') return; if (!$('#sheet').hidden) closeSheet(); else if (guide.open) closeGuide(); });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    if (tm.end && !tm.lock) { try { tm.lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
    if (ui.view === 'today' && ui.date < today() && !tm.end) { /* keep the chosen date */ }
  } else { tm.lock = null; }
});

/* ---------- Boot ---------- */
loadLocal();
render();
initCloud();


if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
